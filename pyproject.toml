
[project]
name = "Finlytics"
version = "0.1.0"
description = "Finlytics - Financial Analytics API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
